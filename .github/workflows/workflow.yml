name: Upload SGHI FHIR Implentation Guide(IG) Resources To HAPI FHIR server

on: [push]

env:
  HAPI_FHIR_BASE_URL: ${{ secrets.HAPI_FHIR_BASE_URL }}
  HAPI_USERNAME: ${{ secrets.HAPI_USERNAME }}
  HAPI_PASSWORD: ${{ secrets.HAPI_PASSWORD }}
  # Set as environment secrets on any environment whose FHIR server sits behind
  # Keycloak. When all three are present the uploads use an OAuth2
  # client_credentials bearer token; when none are present they use basic auth.
  OIDC_TOKEN_URL: ${{ secrets.OIDC_TOKEN_URL }}
  OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
  OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}

jobs:
  build-and-publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        environment: [testing, staging, prod]

    environment:
      name: ${{ matrix.environment }}
    
    steps:
      - name: Check Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
        
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm jq
          npm install -g fsh-sushi

      - name: Update sushi-config.yaml
        run: |
          echo "Replacing default canonical 'https://fhir.slade360.co.ke/fhir' with '${{ env.HAPI_FHIR_BASE_URL }}' in sushi-config.yaml"
          sed -i "s|https://fhir.slade360.co.ke/fhir|${{ env.HAPI_FHIR_BASE_URL }}|g" sushi-config.yaml
          echo "Updated sushi-config.yaml:"
          cat sushi-config.yaml

      - name: Run SUSHI Build
        run: |
          sushi -s .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Not ./_updatePublisher.sh: it prompts for confirmation, and with no TTY on the
      # runner every `read` returns empty, so it skips `mkdir input-cache`, prints
      # "cancelled publisher update" and still exits 0 - leaving _genonce.sh with no jar.
      # Fetching the jar directly also avoids `-y`, which overwrites the repo's own
      # _*.sh scripts with whatever HL7 published that day.
      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -fL --retry 3 \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar
          test -s input-cache/publisher.jar

      - name: Generate FHIR IG and Snapshots
        run: |
          echo "Generating FHIR Implementation Guide and snapshots..."
          ./_genonce.sh

          # _genonce.sh exits 0 even when it cannot find the publisher and aborts,
          # so check for real output rather than trusting its status.
          if [ ! -d output ]; then
            echo "IG Publisher produced no output/ directory."
            exit 1
          fi
          echo "IG generation and snapshot creation complete."

      # StructureMaps are compiled from input/maps/*.fml by the IG Publisher, not by
      # SUSHI, so they exist only in output/ and only after the step above. Handing
      # them to publish-structure-maps-to-hapi as an artifact lets that job upload
      # them without re-running the publisher. Per-environment because the canonical
      # URL rewrite above differs on each matrix leg.
      - name: Share built StructureMaps with the publish job
        uses: actions/upload-artifact@v4
        with:
          name: structure-maps-${{ matrix.environment }}
          path: output/StructureMap-*.json
          if-no-files-found: error
          retention-days: 1
          
      - name: Publish FHIR Artifacts to HAPI FHIR
        run: |
          echo "Publishing to server: ${{ env.HAPI_FHIR_BASE_URL }}"

          AUTH_HEADER=""
          TOKEN_EXPIRES_AT=0

          if [ -z "${HAPI_FHIR_BASE_URL}" ]; then
            echo "HAPI_FHIR_BASE_URL is not set for this environment."
            exit 1
          fi

          # Count how many of the three OIDC secrets this environment defines, so a
          # partially-configured environment fails loudly instead of silently
          # falling back to basic auth against a server that requires a token.
          OIDC_SET=0
          for value in "${OIDC_TOKEN_URL}" "${OIDC_CLIENT_ID}" "${OIDC_CLIENT_SECRET}"; do
            [ -n "$value" ] && OIDC_SET=$((OIDC_SET + 1))
          done

          if [ "$OIDC_SET" -eq 3 ]; then
            AUTH_MODE="bearer"
          elif [ "$OIDC_SET" -ne 0 ]; then
            echo "Incomplete OIDC configuration: only ${OIDC_SET} of 3 secrets are set."
            echo "  OIDC_TOKEN_URL:     $([ -n "${OIDC_TOKEN_URL}" ] && echo set || echo MISSING)"
            echo "  OIDC_CLIENT_ID:     $([ -n "${OIDC_CLIENT_ID}" ] && echo set || echo MISSING)"
            echo "  OIDC_CLIENT_SECRET: $([ -n "${OIDC_CLIENT_SECRET}" ] && echo set || echo MISSING)"
            echo "Set all three for this environment, or none to use basic auth."
            exit 1
          elif [ -n "${HAPI_USERNAME}" ] && [ -n "${HAPI_PASSWORD}" ]; then
            AUTH_MODE="basic"
            AUTH_HEADER="Authorization: Basic $(echo -n "${HAPI_USERNAME}:${HAPI_PASSWORD}" | base64 | tr -d '\n')"
          else
            echo "No credentials for this environment: set either the three OIDC_* secrets or HAPI_USERNAME/HAPI_PASSWORD."
            exit 1
          fi
          echo "Authentication mode: $AUTH_MODE"

          # Requests a client_credentials access token and updates AUTH_HEADER.
          fetch_token() {
            local response token expires_in
            response=$(curl -s -X POST "${OIDC_TOKEN_URL}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d grant_type=client_credentials \
              --data-urlencode "client_id=${OIDC_CLIENT_ID}" \
              --data-urlencode "client_secret=${OIDC_CLIENT_SECRET}")

            token=$(echo "$response" | jq -r '.access_token // empty')
            if [ -z "$token" ]; then
              echo "Failed to obtain access token from ${OIDC_TOKEN_URL}"
              echo "$response" | jq -r '.error_description // .error // "unknown error"'
              exit 1
            fi

            # Renew 60s early so a long upload run never uses an expired token.
            expires_in=$(echo "$response" | jq -r '.expires_in // 300')
            TOKEN_EXPIRES_AT=$(( $(date +%s) + expires_in - 60 ))
            AUTH_HEADER="Authorization: Bearer ${token}"
            echo "Access token acquired (length ${#token}, expires in ${expires_in}s)"
          }

          # Must be called from the top-level shell (not a subshell) so the
          # refreshed AUTH_HEADER is visible to subsequent uploads.
          ensure_auth() {
            if [ "$AUTH_MODE" = "bearer" ] && [ "$(date +%s)" -ge "$TOKEN_EXPIRES_AT" ]; then
              fetch_token
            fi
          }

          upload_resource() {
            local file="$1"
            local resource_type="$2"
            local resource_id="$3"

            echo "Uploading $file with resourceType=$resource_type, id=$resource_id"

            ensure_auth

            # Judge success on the HTTP status, not the response body. A 4xx/5xx whose
            # body carries no .issue array used to read as success, and a 200 whose body
            # is an informational OperationOutcome used to read as failure.
            RESPONSE=$(curl -s -w '\n%{http_code}' -X PUT "${HAPI_FHIR_BASE_URL}/${resource_type}/${resource_id}" \
              -H "Content-Type: application/fhir+json" \
              -H "${AUTH_HEADER}" \
              --data-binary "@$file")

            STATUS_CODE=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            echo "Response (HTTP $STATUS_CODE): $BODY"

            if [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "201" ]; then
              echo "Upload failed for $file: HTTP $STATUS_CODE"
              exit 1
            fi

            RETRIEVED_RESOURCE=$(curl -s -X GET "${HAPI_FHIR_BASE_URL}/${resource_type}/${resource_id}" -H "Accept: application/fhir+json" -H "${AUTH_HEADER}")
            echo "Retrieved Resource after Upload: $RETRIEVED_RESOURCE"
          }

          echo "Uploading CodeSystems"
          for file in fsh-generated/resources/*.json; do
            if [ -f "$file" ]; then
              RESOURCE_TYPE=$(jq -r '.resourceType' "$file")
              RESOURCE_ID=$(jq -r '.id' "$file")
              if [ "$RESOURCE_TYPE" = "CodeSystem" ]; then
                upload_resource "$file" "$RESOURCE_TYPE" "$RESOURCE_ID"
              fi
            fi
          done

          echo "Uploading ValueSets"
          for file in fsh-generated/resources/*.json; do
            if [ -f "$file" ]; then
              RESOURCE_TYPE=$(jq -r '.resourceType' "$file")
              RESOURCE_ID=$(jq -r '.id' "$file")
              if [ "$RESOURCE_TYPE" = "ValueSet" ]; then
                upload_resource "$file" "$RESOURCE_TYPE" "$RESOURCE_ID"
              fi
            fi
          done

          echo "Uploading other Conformance Resources"
          for file in fsh-generated/resources/*.json; do
            if [ -f "$file" ]; then
              RESOURCE_TYPE=$(jq -r '.resourceType' "$file")
              RESOURCE_ID=$(jq -r '.id' "$file")
              if [ "$RESOURCE_TYPE" = "StructureDefinition" ] || [ "$RESOURCE_TYPE" = "ConceptMap" ]; then
                upload_resource "$file" "$RESOURCE_TYPE" "$RESOURCE_ID"
              fi
            fi
          done

          echo "All conformance resources uploaded successfully."

  # Split out of build-and-publish so StructureMaps land only after every profile they
  # reference has been published. Mirrors that job's matrix so each leg targets the
  # environment its maps were built for, and declares `environment:` so the
  # per-environment secrets resolve.
  publish-structure-maps-to-hapi:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build-and-publish
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [testing, staging, prod]

    environment:
      name: ${{ matrix.environment }}

    steps:
      # No checkout: this job needs the built maps and jq, nothing from the repo.
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download StructureMaps built for ${{ matrix.environment }}
        uses: actions/download-artifact@v4
        with:
          name: structure-maps-${{ matrix.environment }}
          path: output

      - name: Publish StructureMaps to HAPI FHIR
        run: |
          echo "Publishing StructureMaps to server: ${{ env.HAPI_FHIR_BASE_URL }}"

          AUTH_HEADER=""
          TOKEN_EXPIRES_AT=0

          if [ -z "${HAPI_FHIR_BASE_URL}" ]; then
            echo "HAPI_FHIR_BASE_URL is not set for this environment."
            exit 1
          fi

          # Same rule as build-and-publish: all three OIDC secrets or none, so a
          # half-configured environment fails instead of silently falling back to
          # basic auth against a server that requires a token.
          OIDC_SET=0
          for value in "${OIDC_TOKEN_URL}" "${OIDC_CLIENT_ID}" "${OIDC_CLIENT_SECRET}"; do
            [ -n "$value" ] && OIDC_SET=$((OIDC_SET + 1))
          done

          if [ "$OIDC_SET" -eq 3 ]; then
            AUTH_MODE="bearer"
          elif [ "$OIDC_SET" -ne 0 ]; then
            echo "Incomplete OIDC configuration: only ${OIDC_SET} of 3 secrets are set."
            echo "  OIDC_TOKEN_URL:     $([ -n "${OIDC_TOKEN_URL}" ] && echo set || echo MISSING)"
            echo "  OIDC_CLIENT_ID:     $([ -n "${OIDC_CLIENT_ID}" ] && echo set || echo MISSING)"
            echo "  OIDC_CLIENT_SECRET: $([ -n "${OIDC_CLIENT_SECRET}" ] && echo set || echo MISSING)"
            echo "Set all three for this environment, or none to use basic auth."
            exit 1
          elif [ -n "${HAPI_USERNAME}" ] && [ -n "${HAPI_PASSWORD}" ]; then
            AUTH_MODE="basic"
            AUTH_HEADER="Authorization: Basic $(echo -n "${HAPI_USERNAME}:${HAPI_PASSWORD}" | base64 | tr -d '\n')"
          else
            echo "No credentials for this environment: set either the three OIDC_* secrets or HAPI_USERNAME/HAPI_PASSWORD."
            exit 1
          fi
          echo "Authentication mode: $AUTH_MODE"

          # Requests a client_credentials access token and updates AUTH_HEADER.
          fetch_token() {
            local response token expires_in
            response=$(curl -s -X POST "${OIDC_TOKEN_URL}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d grant_type=client_credentials \
              --data-urlencode "client_id=${OIDC_CLIENT_ID}" \
              --data-urlencode "client_secret=${OIDC_CLIENT_SECRET}")

            token=$(echo "$response" | jq -r '.access_token // empty')
            if [ -z "$token" ]; then
              echo "Failed to obtain access token from ${OIDC_TOKEN_URL}"
              echo "$response" | jq -r '.error_description // .error // "unknown error"'
              exit 1
            fi

            # Renew 60s early so a long upload run never uses an expired token.
            expires_in=$(echo "$response" | jq -r '.expires_in // 300')
            TOKEN_EXPIRES_AT=$(( $(date +%s) + expires_in - 60 ))
            AUTH_HEADER="Authorization: Bearer ${token}"
            echo "Access token acquired (length ${#token}, expires in ${expires_in}s)"
          }

          # Must be called from the top-level shell (not a subshell) so the
          # refreshed AUTH_HEADER is visible to subsequent uploads.
          ensure_auth() {
            if [ "$AUTH_MODE" = "bearer" ] && [ "$(date +%s)" -ge "$TOKEN_EXPIRES_AT" ]; then
              fetch_token
            fi
          }

          upload_structure_map() {
            local file="$1"
            local resource_id="$2"

            echo "Uploading $file with id=$resource_id"

            ensure_auth

            # Judge success on the HTTP status, not the response body. A 4xx/5xx whose
            # body carries no .issue array would read as success, and a 200 whose body
            # is an informational OperationOutcome would read as failure.
            RESPONSE=$(curl -s -w '\n%{http_code}' -X PUT "${HAPI_FHIR_BASE_URL}/StructureMap/${resource_id}" \
              -H "Content-Type: application/fhir+json" \
              -H "${AUTH_HEADER}" \
              --data-binary "@$file")

            STATUS_CODE=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            echo "Response (HTTP $STATUS_CODE): $BODY"

            if [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "201" ]; then
              echo "Upload failed for $file: HTTP $STATUS_CODE"
              exit 1
            fi
          }

          STRUCTURE_MAP_COUNT=0
          for file in output/StructureMap-*.json; do
            if [ -f "$file" ]; then
              RESOURCE_TYPE=$(jq -r '.resourceType' "$file")
              RESOURCE_ID=$(jq -r '.id // empty' "$file")
              if [ "$RESOURCE_TYPE" = "StructureMap" ] && [ -n "$RESOURCE_ID" ]; then
                upload_structure_map "$file" "$RESOURCE_ID"
                STRUCTURE_MAP_COUNT=$((STRUCTURE_MAP_COUNT + 1))
              fi
            fi
          done

          # An unmatched glob leaves the pattern unexpanded and the loop body never
          # runs, so without this the step would report success having uploaded nothing.
          if [ "$STRUCTURE_MAP_COUNT" -eq 0 ]; then
            echo "No StructureMaps found in output/ - was the artifact empty?"
            exit 1
          fi
          echo "Uploaded ${STRUCTURE_MAP_COUNT} StructureMaps successfully."
