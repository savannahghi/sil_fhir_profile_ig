name: Upload SGHI FHIR Implentation Guide(IG) Resources To HAPI FHIR server

on: [push]

env:
  HAPI_FHIR_BASE_URL: ${{ secrets.HAPI_FHIR_BASE_URL }}
  HAPI_USERNAME: ${{ secrets.HAPI_USERNAME }}
  HAPI_PASSWORD: ${{ secrets.HAPI_PASSWORD }}
  MATCHBOX_BASE_URL: ${{ secrets.MATCHBOX_BASE_URL }}
  # Set as environment secrets on any environment whose FHIR server sits behind
  # Keycloak. When all three are present the uploads use an OAuth2
  # client_credentials bearer token; when none are present they use basic auth.
  OIDC_TOKEN_URL: ${{ secrets.OIDC_TOKEN_URL }}
  OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
  OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}

jobs:
  build-and-publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        environment: [testing, staging, prod]

    environment:
      name: ${{ matrix.environment }}
    
    steps:
      - name: Check Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
        
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm jq
          npm install -g fsh-sushi

      - name: Update sushi-config.yaml
        run: |
          echo "Replacing default canonical 'https://fhir.slade360.co.ke/fhir' with '${{ env.HAPI_FHIR_BASE_URL }}' in sushi-config.yaml"
          sed -i "s|https://fhir.slade360.co.ke/fhir|${{ env.HAPI_FHIR_BASE_URL }}|g" sushi-config.yaml
          echo "Updated sushi-config.yaml:"
          cat sushi-config.yaml

      - name: Run SUSHI Build
        run: |
          sushi -s .

      - name: Generate FHIR IG and Snapshots
        run: |
          echo "Generating FHIR Implementation Guide and snapshots..."
          ./_updatePublisher.sh
          ./_genonce.sh
          echo "IG generation and snapshot creation complete."
          
      - name: Publish FHIR Artifacts to HAPI FHIR
        run: |
          echo "Publishing to server: ${{ env.HAPI_FHIR_BASE_URL }}"

          AUTH_HEADER=""
          TOKEN_EXPIRES_AT=0

          if [ -z "${HAPI_FHIR_BASE_URL}" ]; then
            echo "HAPI_FHIR_BASE_URL is not set for this environment."
            exit 1
          fi

          # Count how many of the three OIDC secrets this environment defines, so a
          # partially-configured environment fails loudly instead of silently
          # falling back to basic auth against a server that requires a token.
          OIDC_SET=0
          for value in "${OIDC_TOKEN_URL}" "${OIDC_CLIENT_ID}" "${OIDC_CLIENT_SECRET}"; do
            [ -n "$value" ] && OIDC_SET=$((OIDC_SET + 1))
          done

          if [ "$OIDC_SET" -eq 3 ]; then
            AUTH_MODE="bearer"
          elif [ "$OIDC_SET" -ne 0 ]; then
            echo "Incomplete OIDC configuration: only ${OIDC_SET} of 3 secrets are set."
            echo "  OIDC_TOKEN_URL:     $([ -n "${OIDC_TOKEN_URL}" ] && echo set || echo MISSING)"
            echo "  OIDC_CLIENT_ID:     $([ -n "${OIDC_CLIENT_ID}" ] && echo set || echo MISSING)"
            echo "  OIDC_CLIENT_SECRET: $([ -n "${OIDC_CLIENT_SECRET}" ] && echo set || echo MISSING)"
            echo "Set all three for this environment, or none to use basic auth."
            exit 1
          elif [ -n "${HAPI_USERNAME}" ] && [ -n "${HAPI_PASSWORD}" ]; then
            AUTH_MODE="basic"
            AUTH_HEADER="Authorization: Basic $(echo -n "${HAPI_USERNAME}:${HAPI_PASSWORD}" | base64 | tr -d '\n')"
          else
            echo "No credentials for this environment: set either the three OIDC_* secrets or HAPI_USERNAME/HAPI_PASSWORD."
            exit 1
          fi
          echo "Authentication mode: $AUTH_MODE"

          # Requests a client_credentials access token and updates AUTH_HEADER.
          fetch_token() {
            local response token expires_in
            response=$(curl -s -X POST "${OIDC_TOKEN_URL}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d grant_type=client_credentials \
              --data-urlencode "client_id=${OIDC_CLIENT_ID}" \
              --data-urlencode "client_secret=${OIDC_CLIENT_SECRET}")

            token=$(echo "$response" | jq -r '.access_token // empty')
            if [ -z "$token" ]; then
              echo "Failed to obtain access token from ${OIDC_TOKEN_URL}"
              echo "$response" | jq -r '.error_description // .error // "unknown error"'
              exit 1
            fi

            # Renew 60s early so a long upload run never uses an expired token.
            expires_in=$(echo "$response" | jq -r '.expires_in // 300')
            TOKEN_EXPIRES_AT=$(( $(date +%s) + expires_in - 60 ))
            AUTH_HEADER="Authorization: Bearer ${token}"
            echo "Access token acquired (length ${#token}, expires in ${expires_in}s)"
          }

          # Must be called from the top-level shell (not a subshell) so the
          # refreshed AUTH_HEADER is visible to subsequent uploads.
          ensure_auth() {
            if [ "$AUTH_MODE" = "bearer" ] && [ "$(date +%s)" -ge "$TOKEN_EXPIRES_AT" ]; then
              fetch_token
            fi
          }

          upload_resource() {
            local file="$1"
            local resource_type="$2"
            local resource_id="$3"

            echo "Uploading $file with resourceType=$resource_type, id=$resource_id"

            ensure_auth

            RESPONSE=$(curl -s -X PUT "${HAPI_FHIR_BASE_URL}/${resource_type}/${resource_id}" \
              -H "Content-Type: application/fhir+json" \
              -H "${AUTH_HEADER}" \
              --data-binary "@$file")

            echo "Response: $RESPONSE"
            STATUS_CODE=$(echo "$RESPONSE" | jq -r '.issue[0].severity // "unknown"')

            if [ "$STATUS_CODE" != "unknown" ]; then
              echo "Upload failed for $file: $STATUS_CODE"
              exit 1
            fi

            RETRIEVED_RESOURCE=$(curl -s -X GET "${HAPI_FHIR_BASE_URL}/${resource_type}/${resource_id}" -H "Accept: application/fhir+json" -H "${AUTH_HEADER}")
            echo "Retrieved Resource after Upload: $RETRIEVED_RESOURCE"
          }

          echo "Uploading CodeSystems"
          for file in fsh-generated/resources/*.json; do
            if [ -f "$file" ]; then
              RESOURCE_TYPE=$(jq -r '.resourceType' "$file")
              RESOURCE_ID=$(jq -r '.id' "$file")
              if [ "$RESOURCE_TYPE" = "CodeSystem" ]; then
                upload_resource "$file" "$RESOURCE_TYPE" "$RESOURCE_ID"
              fi
            fi
          done

          echo "Uploading ValueSets"
          for file in fsh-generated/resources/*.json; do
            if [ -f "$file" ]; then
              RESOURCE_TYPE=$(jq -r '.resourceType' "$file")
              RESOURCE_ID=$(jq -r '.id' "$file")
              if [ "$RESOURCE_TYPE" = "ValueSet" ]; then
                upload_resource "$file" "$RESOURCE_TYPE" "$RESOURCE_ID"
              fi
            fi
          done

          echo "Uploading other Conformance Resources"
          for file in fsh-generated/resources/*.json; do
            if [ -f "$file" ]; then
              RESOURCE_TYPE=$(jq -r '.resourceType' "$file")
              RESOURCE_ID=$(jq -r '.id' "$file")
              if [ "$RESOURCE_TYPE" = "StructureDefinition" ] || [ "$RESOURCE_TYPE" = "ConceptMap" ]; then
                upload_resource "$file" "$RESOURCE_TYPE" "$RESOURCE_ID"
              fi
            fi
          done
      
          echo "All conformance resources uploaded successfully."

  publish-structure-maps:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Publish StructureMaps to Matchbox
        run: |
          echo "Publishing StructureMaps to Matchbox server: ${{ env.MATCHBOX_BASE_URL }}"

          # This job declares no environment, so it only sees repository-level
          # secrets — the OIDC_* names below resolve to empty unless they are also
          # defined at repository level, in which case basic auth is used.
          if [ -n "${OIDC_TOKEN_URL}" ] && [ -n "${OIDC_CLIENT_ID}" ] && [ -n "${OIDC_CLIENT_SECRET}" ]; then
            TOKEN=$(curl -s -X POST "${OIDC_TOKEN_URL}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d grant_type=client_credentials \
              --data-urlencode "client_id=${OIDC_CLIENT_ID}" \
              --data-urlencode "client_secret=${OIDC_CLIENT_SECRET}" | jq -r '.access_token // empty')
            if [ -z "$TOKEN" ]; then
              echo "Failed to obtain access token from ${OIDC_TOKEN_URL}"
              exit 1
            fi
            AUTH_HEADER="Authorization: Bearer ${TOKEN}"
          else
            AUTH_HEADER="Authorization: Basic $(echo -n "${HAPI_USERNAME}:${HAPI_PASSWORD}" | base64 | tr -d '\n')"
          fi

          for file in output/StructureMap-*.json; do
            if [ -f "$file" ]; then
              RESOURCE_ID=$(jq -r '.id' "$file")

              echo "Uploading $file (StructureMap/$RESOURCE_ID)"

              RESPONSE=$(curl -s -X PUT "${MATCHBOX_BASE_URL}/StructureMap/${RESOURCE_ID}" \
                -H "Content-Type: application/fhir+json" \
                -H "${AUTH_HEADER}" \
                --data-binary "@$file")

              echo "Response: $RESPONSE"
              STATUS_CODE=$(echo "$RESPONSE" | jq -r '.issue[0].severity // "unknown"')

              if [ "$STATUS_CODE" != "unknown" ]; then
                echo "Upload failed for $file: $STATUS_CODE"
                exit 1
              fi
            fi
          done

          echo "All StructureMaps uploaded successfully."
      